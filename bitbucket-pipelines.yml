image: node:22

clone:
  depth: 1

# On-demand BrowserStack regression pipelines. Each platform step always exits 0
# after recording its real outcome in test-status/. The final report step reads
# those files, prints the combined result, and owns the pipeline verdict.
definitions:
  steps:
    - step: &test-android
        name: Android E2E (BrowserStack matrix)
        size: 2x
        max-time: 240
        script:
          - mkdir -p test-status
          - |
            if [ -z "${BS_APP_URL_ANDROID:-}" ]; then
              echo "EXIT=skipped" > test-status/android.env
              echo "No Android bs:// URL provided — skipping"
            else
              export BROWSERSTACK=true
              export BS_APP_URL="$BS_APP_URL_ANDROID"
              export APP_PACKAGE="${ANDROID_APP_PACKAGE:-}"
              export APP_ACTIVITY="${ANDROID_APP_ACTIVITY:-}"
              export APP_DISPLAY_NAME="${APP_DISPLAY_NAME:-Mobile App}"
              export TEST_SECTIONS="${TEST_SECTIONS:-all}"
              if [ "$TEST_SECTIONS" = "all" ]; then
                export E2E_RUN_LABEL=Regression
              else
                export E2E_RUN_LABEL="Focused E2E"
              fi
              export MAX_CONSECUTIVE_FAILURES="${MAX_CONSECUTIVE_FAILURES:-5}"
              platform_exit=0
              (cd android && npm ci && npm run test:ci) || platform_exit=$?
              echo "EXIT=$platform_exit" > test-status/android.env
            fi
        artifacts:
          - android/test-results/**
          - android/screenshots/**
          - test-status/**

    - step: &test-ios
        name: iOS E2E (BrowserStack matrix)
        size: 2x
        max-time: 240
        script:
          - mkdir -p test-status
          - |
            if [ -z "${BS_APP_URL_IOS:-}" ]; then
              echo "EXIT=skipped" > test-status/ios.env
              echo "No iOS bs:// URL provided — skipping"
            else
              export BROWSERSTACK=true
              export BS_APP_URL="$BS_APP_URL_IOS"
              export BUNDLE_ID="${IOS_BUNDLE_ID:-}"
              export APP_DISPLAY_NAME="${APP_DISPLAY_NAME:-Mobile App}"
              export TEST_SECTIONS="${TEST_SECTIONS:-all}"
              if [ "$TEST_SECTIONS" = "all" ]; then
                export E2E_RUN_LABEL=Regression
              else
                export E2E_RUN_LABEL="Focused E2E"
              fi
              export MAX_CONSECUTIVE_FAILURES="${MAX_CONSECUTIVE_FAILURES:-5}"
              platform_exit=0
              (cd ios && npm ci && npm run test:ci) || platform_exit=$?
              echo "EXIT=$platform_exit" > test-status/ios.env
            fi
        artifacts:
          - ios/test-results/**
          - ios/screenshots/**
          - test-status/**

    - step: &report
        name: Run summary + final verdict
        script:
          - export APP_DISPLAY_NAME="${APP_DISPLAY_NAME:-Mobile App}"
          - if [ "${TEST_SECTIONS:-all}" = "all" ]; then export E2E_RUN_LABEL=Regression; else export E2E_RUN_LABEL="Focused E2E"; fi
          - node ci/report.js

pipelines:
  custom:
    regression:
      - variables:
          - name: BS_APP_URL_ANDROID
            default: ""
          - name: BS_APP_URL_IOS
            default: ""
          - name: TEST_SECTIONS
            default: all
      - parallel:
          # Two devices per platform means up to four App Automate sessions.
          # Use BS_MATRIX_CONCURRENCY=1 or make these steps sequential if the
          # BrowserStack plan has fewer parallel slots.
          - step: *test-android
          - step: *test-ios
      - step: *report

    regression-android:
      - variables:
          - name: BS_APP_URL_ANDROID
          - name: TEST_SECTIONS
            default: all
      - step: *test-android
      - step: *report

    regression-ios:
      - variables:
          - name: BS_APP_URL_IOS
          - name: TEST_SECTIONS
            default: all
      - step: *test-ios
      - step: *report
